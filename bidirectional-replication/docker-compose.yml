services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgsql_test_bidirectional
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "9898:5432"
    # command: sh -c "cp /pg_hba.conf /var/lib/postgresql/data/pg_hba.conf && docker-entrypoint.sh postgres"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d
      - ./pg_hba.conf:/pg_hba.conf
